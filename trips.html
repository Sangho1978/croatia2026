<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes,maximum-scale=5"><title>공공리더십 17기 하반기 국외연수</title><meta name="theme-color" content="#0b456b"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#eef4f7;color:#163649}.hero{min-height:320px;background:linear-gradient(180deg,#071e2e22,#071e2ecc),url('assets/images/login_three_countries.jpg') center/cover;color:#fff;display:flex;align-items:flex-end}.hero-in{width:min(1040px,100%);margin:auto;padding:38px 20px}.hero small{font-weight:900;letter-spacing:.08em}.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.08;margin:9px 0}.hero p{font-size:17px;margin:0}.wrap{max-width:1040px;margin:auto;padding:22px 18px 60px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.trip{background:#fff;border:1px solid #d7e3e9;border-radius:24px;overflow:hidden;box-shadow:0 12px 30px #12394a12}.photo{height:150px;background-size:cover;background-position:center}.body{padding:17px}.flag{font-size:26px}.body h2{margin:5px 0}.body p{color:#617584;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{padding:11px 13px;border-radius:13px;text-decoration:none;font-weight:850;border:1px solid #ccdce5;color:#145170}.actions .primary{background:#0b5b83;color:#fff;border-color:#0b5b83}.turteams{display:grid;gap:7px}.wait{opacity:.65}.note{margin-top:18px;color:#647682}@media(max-width:760px){.grid{grid-template-columns:1fr}.photo{height:180px}}</style></head><body><section class="hero"><div class="hero-in"><small>서울대학교 행정대학원</small><h1>공공리더십 17기<br>하반기 국외연수</h1><p>크로아티아 · 튀르키예 · 이탈리아 북부</p></div></section><main class="wrap"><div id="grid" class="grid"></div><p class="note">각 팀 링크는 같은 공통 엔진을 사용하지만 일정·명단·호텔·관광정보·Firebase DB는 팀별로 분리됩니다.</p></main><script src="platform/trips.js?v=20260926-MIX40"></script><script>const C=GSPA_TRIP_CATALOG.trips,g=document.getElementById('grid');const pics={croatia:'assets/images/css_14_b800704dc5.jpg',turkiye1:'assets/images/turkiye1/bosphorus.jpg',turkiye2:'assets/images/turkiye1/istanbul_core.jpg','italy-north':'assets/images/login_three_countries.jpg'};for(const t of C){if(t.id==='turkiye2')continue;const a=document.createElement('article');a.className='trip '+(t.status==='ready'?'':'wait');a.innerHTML=`<div class="photo" style="background-image:url('${pics[t.id]}')"></div><div class="body"><div class="flag">${t.flag||'✈'}</div><h2>${t.id==='turkiye1'?'튀르키예':t.name}</h2>${t.id==='turkiye1'?'<div class="turteams"><b>1팀 · 10/19–10/27</b><span>2팀 · 자료 입력 예정</span></div>':`<p><b>${t.dateLabel||'자료 입력 예정'}</b></p>`}<p>${t.description||''}</p><div class="actions">${t.status==='ready'?`<a class="primary" href="${t.appUrl}">앱 열기</a>`:'<a href="#" onclick="return false">자료 대기</a>'}${t.booklet?`<a href="${t.booklet}" target="_blank">안내책자</a>`:''}</div></div>`;g.appendChild(a)}</script></body></html>
